<!doctype html>
<html lang="da">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
</head>

<body>
  <header></header>
  <main>
    <h1>Opret din førerprofil</h1>

    <section class="Bekraeft-og-opret">
      <h2> Bekræft og opret</h2>

      <div class="Afkrydsning">
        <input type="checkbox" id="gyldigt-koerekort" required>
        <label for="gyldigt-koerekort">
          Jeg bekræfter, at jeg er fyldt 21 år
          og har et gyldigt kørekort.
        </label>
      </div>

      <div class="Afkrydsning">
        <input type="checkbox" id="vilkaar-og-betingelser" required>
        <label for="vilkaar-og-betingelser">
          Jeg accepterer vilkår og betingelser samt privatlivspolitikken.
        </label>
      </div>

      <div class="Afkrydsning">
        <input type="checkbox" id="tilbud-og-nyheder">
        <label for="tilbud-og-nyheder">
          Send mig gerne tilbud, nyheder og inspiration til min næste køretur (valgfrit).
        </label>
      </div>

    </section>

  </main>
  <footer></footer>
</body>

</html>
